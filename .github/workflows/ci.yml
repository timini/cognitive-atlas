name: Validate research and website
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.2'
      - run: uv sync --frozen --python 3.12
      - run: uv run pytest -q
      - run: uv run ruff check atlas tests scripts
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
